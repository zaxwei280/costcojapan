<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8a9a8b">
<title>好市多商品照片</title>
<style>
:root{
  --bg:#f3f0eb; --card:#fbfaf7; --ink:#3d3a36; --sub:#8b857d; --line:#e2ddd5;
  --main:#8a9a8b; --main-d:#6f7f70; --rose:#c49a94; --rose-d:#a8807a;
  --blue:#8e9fae; --sand:#d8c9b2; --shadow:0 2px 10px rgba(60,55,50,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang TC","Noto Sans TC",sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;flex:1;letter-spacing:.5px}
.top h1 small{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:2px}
.iconbtn{border:0;background:var(--card);width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);font-size:17px}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;outline:none}
.search input:focus{border-color:var(--main)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--sub)}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);padding:2px 2px 0}
.bar select{border:0;background:transparent;color:var(--sub);font-size:12px}
main{padding:6px 16px calc(env(safe-area-inset-bottom) + 96px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item{position:relative;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column}
.editbtn{position:absolute;top:6px;right:6px;z-index:2;width:32px;height:32px;border-radius:10px;border:0;background:rgba(251,250,247,.92);color:var(--main-d);font-size:15px;box-shadow:var(--shadow)}
.thumb{position:relative;aspect-ratio:1/1;background:#ebe6de;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cnt{position:absolute;right:6px;bottom:6px;background:rgba(40,38,35,.55);color:#fff;font-size:11px;border-radius:8px;padding:2px 6px}
.salebadge{position:absolute;left:6px;top:6px;background:var(--rose);color:#fff;font-size:11px;border-radius:8px;padding:2px 7px}
.info{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:11px;color:var(--sub)}
.prices{margin-top:auto;display:flex;align-items:baseline;gap:6px;padding-top:4px}
.p-now{font-weight:600;font-size:15px}
.p-sale{font-weight:700;font-size:15px;color:var(--rose-d)}
.p-old{font-size:12px;color:var(--sub);text-decoration:line-through}
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 2px 10px;cursor:pointer;user-select:none}
.sec-h h3{margin:0;font-size:16px;letter-spacing:.5px}
.sec-h .n{font-size:12px;color:var(--sub);background:var(--card);border-radius:999px;padding:2px 9px}
.sec-h .ar{margin-left:auto;color:var(--sub);font-size:12px;transition:transform .2s}
.sec-h::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--main)}
.sec.closed .grid{display:none}
.sec.closed .ar{transform:rotate(-90deg)}
.newcat{display:flex;gap:8px;margin-top:8px}
.newcat[hidden]{display:none}
.newcat input{flex:1;min-width:0;border:1px solid var(--main);background:var(--card);border-radius:12px;padding:11px 12px;outline:none;font-size:16px}
.newcat button{flex:none;border:0;border-radius:12px;padding:0 14px;font-weight:600}
.nc-ok{background:var(--main);color:#fff}
.nc-no{background:var(--card);border:1px solid var(--line)!important;color:var(--sub)}
.codewarn{font-size:12px;color:var(--rose-d);margin-top:5px;line-height:1.4}
.codewarn[hidden]{display:none}
.fld input.bad{border-color:var(--rose)}
body:not(.admin-on) .admin-only{display:none!important}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-top:12px}
.switch b{font-weight:600;display:block}
.switch small{color:var(--sub);font-size:12px}
.tg{position:relative;flex:none;width:52px;height:31px}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.tg span::before{content:"";position:absolute;left:3px;top:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.tg input:checked+span{background:var(--main)}
.tg input:checked+span::before{transform:translateX(21px)}
.lockinfo{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dnav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-size:14px;color:var(--ink)}
.dnav button:disabled{opacity:.35}
.dnav span{flex:none;min-width:56px;text-align:center;font-size:12px;color:var(--sub)}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0}
.pw-mask{-webkit-text-security:disc;text-security:disc}
.pweye{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;color:var(--sub);font-size:13px}
.cardbtn{width:100%;margin-top:12px}
.cardbtn[hidden]{display:none}
.cardview{position:fixed;inset:0;z-index:72;background:rgba(30,28,26,.92);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.cardview.show{display:flex}
.cv-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.cv-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;-webkit-touch-callout:default}
.cv-tip{text-align:center;color:#bbb;font-size:12px;margin:10px 0 4px}
.cv-btns{display:flex;gap:10px;margin-top:8px;max-width:520px;width:100%;align-self:center}
.cv-btns .btn[hidden]{display:none}
.dtabs{display:flex;background:#ebe6de;border-radius:12px;padding:3px;margin-top:12px}
.dtabs button{flex:1;border:0;background:transparent;font-size:13px;padding:8px 4px;border-radius:10px;color:var(--sub)}
.dtabs button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.dpane{background:var(--card);border-radius:16px;margin-top:10px;box-shadow:var(--shadow);padding:14px 15px;line-height:1.8;font-size:15px;white-space:pre-line;word-break:break-word}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dtags:empty{display:none}
.dtag{font-size:12px;padding:4px 10px;border-radius:999px;background:#e5ebe5;color:var(--main-d);border:1px solid #d3dcd3}
.fld textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none;font-size:16px;font-family:inherit;line-height:1.6;resize:vertical;min-height:90px}
.fld textarea:focus{border-color:var(--main)}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagpick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--sub)}
.tagpick button.on{background:var(--main);border-color:var(--main);color:#fff}
.optfld[hidden]{display:none}
.two .fld{min-width:0}
.fld input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;height:46px;line-height:22px;text-align:left}
.fld input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.fld input[type=date]::-webkit-calendar-picker-indicator{margin:0}
.empty{text-align:center;color:var(--sub);padding:60px 10px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:30;width:60px;height:60px;border-radius:20px;border:0;background:var(--main);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(80,95,80,.35)}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(40,38,35,.4);z-index:40;display:none}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;max-height:94vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.sheet.show{transform:translateY(0)}
@media(min-width:700px){.sheet{left:50%;width:560px;margin-left:-280px}}
.sh-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 16px 10px;z-index:2}
.sh-head h2{flex:1;font-size:17px;margin:0}
.d-top{position:sticky;top:0;z-index:3;background:var(--bg);padding-bottom:10px;box-shadow:0 6px 10px -8px rgba(60,55,50,.18)}
.d-top .sh-head{position:static}
.d-top .sh-head h2{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-top .dnav{margin:0 16px}
.sh-body{padding:0 16px}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;border-radius:16px}
.gallery img{flex:none;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center;border-radius:16px;background:#ebe6de}
.dots{text-align:center;font-size:12px;color:var(--sub);margin:6px 0 2px}
.dl{background:var(--card);border-radius:16px;margin-top:12px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--sub);flex:none}
.row span:last-child{text-align:right;word-break:break-all}
.copy{color:var(--blue);text-decoration:underline dotted}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font-weight:600;background:var(--main);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--rose-d);border:1px solid var(--rose)}
.btn:disabled{opacity:.5}
/* form */
.fld{margin-top:12px}
.fld label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none;font-size:16px}
.fld input:focus{border-color:var(--main)}
.two{display:flex;gap:10px}.two .fld{flex:1}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#ebe6de}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(40,38,35,.6);color:#fff;font-size:13px;line-height:22px;padding:0}
.ph .mv{position:absolute;bottom:3px;left:3px;border:0;background:rgba(40,38,35,.6);color:#fff;font-size:10px;border-radius:7px;padding:2px 5px}
.ph .first{position:absolute;bottom:3px;left:3px;background:var(--main);color:#fff;font-size:10px;border-radius:7px;padding:2px 5px}
.addph{aspect-ratio:1/1;border:1.5px dashed var(--sand);border-radius:12px;background:transparent;color:var(--sub);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.addph b{font-size:22px;font-weight:400}
.hint{font-size:11px;color:var(--sub);margin-top:6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:.92}
.loading{position:fixed;inset:0;z-index:55;background:rgba(243,240,235,.7);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--sub);font-size:13px}
.loading.show{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--main);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.viewer{position:fixed;inset:0;z-index:70;background:#111;display:none;align-items:center;justify-content:center}
.viewer.show{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>好市多商品照片<small id="sub">載入中…</small></h1>
    <button class="iconbtn" id="refreshBtn" title="重新整理">↻</button>
    <button class="iconbtn" id="setBtn" title="設定">⚙</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="搜尋 名稱／商品編號／條碼" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <span id="countTxt"></span>
    <select id="sort">
      <option value="edited">最近更新</option>
      <option value="name">名稱</option>
      <option value="code">商品編號</option>
      <option value="priceAsc">價錢 低→高</option>
      <option value="priceDesc">價錢 高→低</option>
      <option value="sale">特價優先</option>
      <option value="date">更新日期 新→舊</option>
    </select>
  </div>
</header>

<main><div id="grid"></div><div class="empty" id="empty" hidden></div></main>

<button class="fab admin-only" id="addBtn">＋</button>

<div class="mask" id="mask"></div>

<!-- 詳細 -->
<div class="sheet" id="detail">
  <div class="d-top">
    <div class="sh-head"><h2 id="dTitle"></h2><button class="iconbtn" data-close>✕</button></div>
    <div class="dnav">
      <button id="dPrev">‹ 上一個</button><span id="dPos"></span><button id="dNext">下一個 ›</button>
    </div>
  </div>
  <div class="sh-body">
    <div class="gallery" id="dGallery"></div>
    <div class="dots" id="dDots"></div>
    <div class="dtags" id="dTags"></div>
    <div class="dtabs" id="dTabs"></div>
    <div class="dl" id="dList"></div>
    <div class="dpane" id="dPane" hidden></div>
    <button class="btn ghost cardbtn" id="dCard">🪪 匯出商品小卡</button>
    <button class="btn ghost cardbtn admin-only" id="dDlAll">⬇ 下載全部照片</button>
    <div class="btns admin-only">
      <button class="btn danger" id="dDel">刪除</button>
      <button class="btn" id="dEdit">編輯</button>
    </div>
  </div>
</div>

<!-- 新增 / 編輯 -->
<div class="sheet" id="form">
  <div class="sh-head"><h2 id="fTitle">新增商品</h2><button class="iconbtn" data-close>✕</button></div>
  <div class="sh-body">
    <div class="fld">
      <label>照片（第一張為封面）</label>
      <div class="photos" id="fPhotos"></div>
      <input type="file" id="fFile" accept="image/*" multiple hidden>
      <div class="hint">照片會自動壓縮後上傳到 Cloudinary，網址用 , 分隔存進 Notion</div>
    </div>
    <div class="fld"><label>商品名稱 *</label><input id="fName" placeholder="例：カークランド ミックスナッツ"></div>
    <div class="two">
      <div class="fld"><label>商品編號</label><input id="fCode" inputmode="numeric" placeholder="例：12345"><div class="codewarn" id="codeWarn" hidden></div></div>
      <div class="fld"><label>分類</label><select id="fCat"></select></div>
    </div>
    <div class="newcat" id="newCatBox" hidden>
      <input id="newCatInput" placeholder="輸入新分類名稱" autocomplete="off">
      <button type="button" class="nc-ok" id="newCatOk">加入</button>
      <button type="button" class="nc-no" id="newCatCancel">取消</button>
    </div>
    <div class="two">
      <div class="fld"><label>條碼</label><input id="fBarcode" inputmode="numeric" placeholder="JAN 碼"></div>
      <div class="fld optfld" id="fWeightBox"><label>重量（kg）</label><input id="fWeight" type="number" inputmode="decimal" step="any" placeholder="例：1.26"></div>
    </div>
    <div class="two">
      <div class="fld"><label>現場價錢（円）</label><input id="fPrice" type="number" inputmode="numeric" placeholder="0"></div>
      <div class="fld"><label>現場特價（円）</label><input id="fSale" type="number" inputmode="numeric" placeholder="沒有就留空"></div>
    </div>
    <div class="two">
      <div class="fld"><label>特價開始</label><input id="fSaleStart" type="date"></div>
      <div class="fld"><label>特價結束</label><input id="fSaleEnd" type="date"></div>
    </div>
    <div class="hint">設定期間後，過了結束日會自動顯示原價；不填期間則特價一直有效</div>
    <div class="fld optfld" id="fTagsBox"><label>重點（用 , 分隔，或點下方常用的）</label><input id="fTags" placeholder="例：日本製, 可退稅"><div class="tagpick" id="fTagPick"></div></div>
    <div class="fld optfld" id="fDescBox"><label>商品說明</label><textarea id="fDesc" rows="6" placeholder="商品介紹、特色、使用方法、注意事項…（可換行）"></textarea></div>
    <div class="fld"><label>更新日期</label><input id="fDate" type="date"></div>
    <div class="btns">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn" id="fSave">儲存</button>
    </div>
  </div>
</div>

<div class="viewer" id="viewer"><img id="vImg" alt=""></div>
<div class="cardview" id="cardView">
  <div class="cv-img"><img id="cardImg" alt="商品小卡"></div>
  <div class="cv-tip">iPhone 也可以長按圖片 →「加入照片」</div>
  <div class="cv-btns">
    <button class="btn ghost" id="cardClose">關閉</button>
    <button class="btn" id="cardShare">分享／存相簿</button>
  </div>
</div>
<div class="loading" id="loading"><div class="spin"></div><div id="loadTxt">處理中…</div></div>
<!-- 設定 -->
<div class="sheet" id="settings">
  <div class="sh-head"><h2>設定</h2><button class="iconbtn" data-close>✕</button></div>
  <div class="sh-body">
    <div id="lockView">
      <div class="fld"><label>管理密碼</label><div class="pwrow"><input id="pwInput" type="text" class="pw-mask" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="輸入數字密碼解鎖"><button type="button" id="pwEye" class="pweye">顯示</button></div></div>
      <div class="btns"><button class="btn" id="pwBtn">解鎖</button></div>
      <div class="lockinfo">一般瀏覽不需要密碼。解鎖後才能開啟新增、編輯、刪除功能。</div>
    </div>
    <div id="adminView" hidden>
      <label class="switch">
        <div><b>顯示管理功能</b><small>新增 ＋、編輯 ✎、刪除按鈕</small></div>
        <span class="tg"><input type="checkbox" id="adminToggle"><span></span></span>
      </label>
      <div class="btns"><button class="btn ghost" id="logoutBtn">鎖定（登出）</button></div>
      <div class="lockinfo">這個設定只會記在目前這台裝置。其他人沒有密碼，永遠看不到管理功能，也無法透過網址修改資料。</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var CACHE_KEY = 'costco_photo_cache_v4';
  var CACHE_TTL = 10 * 60 * 1000; // 10 分鐘
  var MAX_SIDE = 1600, JPEG_Q = 0.82;

  var items = [], categories = [], curCat = '全部', curItem = null;
  var editing = null, formPhotos = [];
  var closedCats = {}, visibleOrder = [], curTab = 'info';
  var has = {}, tagOptions = [];
  try{ closedCats = JSON.parse(localStorage.getItem('costco_closed_cats')) || {}; }catch(e){}

  // Cloudinary 網址自動加上縮圖參數；其他網址原樣使用
  function cdn(u, t){
    if(!/res\.cloudinary\.com\/.+\/image\/upload\//.test(u)) return u;
    return u.replace('/image/upload/', '/image/upload/' + t + '/');
  }
  function thumbUrl(u){ return cdn(u, 'c_fill,w_400,h_400,q_auto,f_auto'); }
  function bigUrl(u){ return cdn(u, 'c_limit,w_1400,q_auto,f_auto'); }

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function yen(n){ return n == null ? '' : '¥' + Number(n).toLocaleString('ja-JP'); }
  function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(function(){e.classList.remove('show');},2200); }
  function loading(on, t){ $('loadTxt').textContent = t || '處理中…'; $('loading').classList.toggle('show', !!on); }

  var KEY_STORE = 'costco_admin_key', SHOW_STORE = 'costco_admin_show';
  function getKey(){ try{ return localStorage.getItem(KEY_STORE) || ''; }catch(e){ return ''; } }
  function setKey(k){ try{ k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); }catch(e){} }
  function getShow(){ try{ return localStorage.getItem(SHOW_STORE) !== '0'; }catch(e){ return true; } }
  function setShow(v){ try{ localStorage.setItem(SHOW_STORE, v ? '1' : '0'); }catch(e){} }
  function applyAdmin(){ document.body.classList.toggle('admin-on', !!getKey() && getShow()); }

  function api(body){
    if(getKey()) body.adminKey = getKey();
    return fetch('/api/notion', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){
        if(r.status === 401 && body.action !== 'auth'){ setKey(''); applyAdmin(); throw new Error('管理密碼已失效，請到 ⚙ 設定重新解鎖'); }
        if(!r.ok) throw new Error(j.error || ('錯誤 ' + r.status));
        return j;
      }); });
  }

  // ===== 快取 =====
  function readCache(){
    try{ var c = JSON.parse(localStorage.getItem(CACHE_KEY)); if(c && Date.now() - c.t < CACHE_TTL) return c; }catch(e){}
    return null;
  }
  function writeCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ t:Date.now(), items:items, categories:categories, has:has, tagOptions:tagOptions })); }catch(e){} }
  function clearCache(){ try{ localStorage.removeItem(CACHE_KEY); }catch(e){} }

  // 先用快取立即顯示，同時一定會從 Notion 抓最新資料再更新畫面
  var lastFetch = 0, fetching = null;
  function fetchFresh(silent){
    if(fetching) return fetching;
    if(!silent) $('sub').textContent = '從 Notion 讀取中…';
    fetching = Promise.all([ api({action:'list'}), api({action:'schema'}) ]).then(function(r){
      items = r[0].items; categories = r[1].categories || []; has = r[1].has || {}; tagOptions = r[1].tagOptions || [];
      lastFetch = Date.now();
      writeCache(); render();
    }).catch(function(e){ if(!silent) $('sub').textContent = '讀取失敗'; toast('讀取失敗：' + e.message); })
      .then(function(){ fetching = null; });
    return fetching;
  }
  function load(force){
    var c = !force && readCache();
    if(c){ items = c.items; categories = c.categories; has = c.has || {}; tagOptions = c.tagOptions || []; render(); return fetchFresh(true); }
    return fetchFresh(false);
  }
  // 切回這個分頁／App 時，超過 30 秒就自動更新
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && Date.now() - lastFetch > 30000) fetchFresh(true);
  });

  // ===== 列表 =====
  function allCats(){
    var set = categories.slice();
    items.forEach(function(i){ if(i.cat && set.indexOf(i.cat) < 0) set.push(i.cat); });
    return set;
  }
  function renderChips(){
    var cats = ['全部'].concat(allCats());
    if(items.some(function(i){ return i.sale != null; })) cats.splice(1,0,'特價中');
    if(cats.indexOf(curCat) < 0) curCat = '全部';
    $('chips').innerHTML = cats.map(function(c){ return '<button class="chip'+(c===curCat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'; }).join('');
  }
  function filtered(){
    var q = $('q').value.trim().toLowerCase();
    var list = items.filter(function(i){
      if(curCat === '特價中'){ if(i.sale == null) return false; }
      else if(curCat !== '全部' && i.cat !== curCat) return false;
      if(!q) return true;
      return (i.name + ' ' + i.code + ' ' + i.barcode + ' ' + i.cat).toLowerCase().indexOf(q) >= 0;
    });
    var s = $('sort').value;
    var eff = function(i){ return i.sale != null ? i.sale : (i.price != null ? i.price : Infinity); };
    list.sort(function(a,b){
      if(s==='name') return a.name.localeCompare(b.name,'ja');
      if(s==='code') return a.code.localeCompare(b.code,'ja',{numeric:true});
      if(s==='priceAsc') return eff(a) - eff(b);
      if(s==='priceDesc') return (eff(b)===Infinity?-1:eff(b)) - (eff(a)===Infinity?-1:eff(a));
      if(s==='date') return (b.date||'').localeCompare(a.date||'') || b.edited.localeCompare(a.edited);
      if(s==='sale') return (b.sale!=null) - (a.sale!=null) || b.edited.localeCompare(a.edited);
      return b.edited.localeCompare(a.edited);
    });
    return list;
  }
  function priceHtml(i){
    if(i.sale != null) return '<span class="p-sale">'+yen(i.sale)+'</span>' + (i.price!=null ? '<span class="p-old">'+yen(i.price)+'</span>' : '');
    if(i.price != null) return '<span class="p-now">'+yen(i.price)+'</span>';
    return '<span class="meta">未填價錢</span>';
  }
  // 依特價期間判斷目前是否特價（saleRaw 保留 Notion 原始特價）
  function applySale(i){
    if(!('saleRaw' in i)) i.saleRaw = i.sale;
    var t = today();
    var on = i.saleRaw != null && (!i.saleStart || t >= i.saleStart) && (!i.saleEnd || t <= i.saleEnd);
    i.sale = on ? i.saleRaw : null;
    i.saleState = i.saleRaw == null ? '' : on ? 'on' : (i.saleStart && t < i.saleStart ? 'future' : 'ended');
  }
  function md(d){ return d ? d.slice(5).replace('-', '/') : ''; }
  function render(){
    items.forEach(applySale);
    renderChips();
    var list = filtered();
    var photoCount = items.reduce(function(n,i){ return n + i.photos.length; }, 0);
    $('sub').textContent = '共 ' + items.length + ' 項商品・' + photoCount + ' 張照片';
    $('countTxt').textContent = '顯示 ' + list.length + ' 項';
    var card = function(i){
      var ph = i.photos[0];
      return '<div class="item" data-id="'+i.id+'"><button class="editbtn admin-only" data-edit="'+i.id+'" title="編輯">✎</button>'+
        '<div class="thumb">'+(ph ? '<img loading="lazy" src="'+esc(thumbUrl(ph))+'" alt="">' : '沒有照片')+
          (i.sale!=null ? '<span class="salebadge">特價'+(i.saleEnd ? ' ~'+md(i.saleEnd) : '')+'</span>' : '')+
          (i.photos.length>1 ? '<span class="cnt">'+i.photos.length+' 張</span>' : '')+'</div>'+
        '<div class="info"><div class="nm">'+esc(i.name || '（未命名）')+'</div>'+
          (i.code ? '<div class="meta">#'+esc(i.code)+'</div>' : '')+
          '<div class="prices">'+priceHtml(i)+'</div></div></div>';
    };
    // 依分類分組（順序跟 Notion 分類選項一致，未分類放最後）
    var order = allCats(), groups = {};
    list.forEach(function(i){ var k = i.cat || '未分類'; (groups[k] = groups[k] || []).push(i); });
    var keys = order.filter(function(c){ return groups[c]; });
    Object.keys(groups).forEach(function(k){ if(keys.indexOf(k) < 0 && k !== '未分類') keys.push(k); });
    if(groups['未分類']) keys.push('未分類');
    visibleOrder = [];
    keys.forEach(function(k){ groups[k].forEach(function(i){ visibleOrder.push(i.id); }); });
    $('grid').innerHTML = keys.map(function(k){
      return '<section class="sec'+(closedCats[k] ? ' closed' : '')+'"><div class="sec-h" data-sec="'+esc(k)+'">'+
        '<h3>'+esc(k)+'</h3><span class="n">'+groups[k].length+'</span><span class="ar">▼</span></div>'+
        '<div class="grid">'+groups[k].map(card).join('')+'</div></section>';
    }).join('');
    $('empty').hidden = list.length > 0;
    $('empty').textContent = items.length ? '找不到符合的商品' : '還沒有商品，按右下角 ＋ 新增';
    openDeepLink();
  }

  // ===== 商品連結（?p=商品編號）=====
  var deepKey = null;
  try{ deepKey = new URLSearchParams(location.search).get('p'); }catch(e){}
  function normId(x){ return String(x || '').replace(/-/g, '').toLowerCase(); }
  function findByKey(k){
    k = String(k || '').trim(); if(!k) return null;
    return items.filter(function(i){ return i.code && i.code.trim() === k; })[0] ||
           items.filter(function(i){ return normId(i.id) === normId(k); })[0] || null;
  }
  function openDeepLink(){
    if(!deepKey) return;
    var it = findByKey(deepKey);
    if(it){ deepKey = null; showDetail(it); }
  }
  function itemLink(it){
    var key = it.code && it.code.trim() ? it.code.trim() : normId(it.id);
    return location.origin + location.pathname + '?p=' + encodeURIComponent(key);
  }
  function setUrl(it){
    try{ history.replaceState(null, '', it ? itemLink(it) : location.pathname); }catch(e){}
  }
  function copyText(t){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
    return new Promise(function(resolve, reject){
      var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy') ? resolve() : reject(); }catch(e){ reject(e); }
      ta.remove();
    });
  }
  function shareText(it){
    var price = it.sale != null ? '特價 ' + yen(it.sale) + (it.saleEnd ? '（至 ' + it.saleEnd.replace(/-/g,'/') + '）' : '')
              : it.price != null ? yen(it.price) : '';
    return [it.name || '', price, itemLink(it)].filter(Boolean).join('\n');
  }

  // ===== Sheet =====
  function openSheet(id){ $('mask').classList.add('show'); $(id).classList.add('show'); $(id).scrollTop = 0; }
  function closeSheets(){ if($('detail').classList.contains('show')) setUrl(null); $('mask').classList.remove('show'); $('detail').classList.remove('show'); $('form').classList.remove('show'); $('settings').classList.remove('show'); }

  function showDetail(it){
    curItem = it;
    $('dTitle').textContent = it.name || '（未命名）';
    var idx = visibleOrder.indexOf(it.id);
    $('dPrev').disabled = idx <= 0;
    $('dNext').disabled = idx < 0 || idx >= visibleOrder.length - 1;
    $('dPos').textContent = idx >= 0 ? (idx + 1) + ' / ' + visibleOrder.length : '';
    $('dGallery').scrollLeft = 0;
    $('detail').scrollTop = 0;
    $('dGallery').innerHTML = it.photos.length
      ? it.photos.map(function(p){ return '<img src="'+esc(bigUrl(p))+'" data-full="'+esc(p)+'" alt="">'; }).join('')
      : '<div class="thumb" style="width:100%;border-radius:16px">沒有照片</div>';
    dlReady = null;
    $('dDlAll').hidden = !it.photos.length;
    $('dDlAll').textContent = '⬇ 下載全部照片（' + it.photos.length + ' 張）';
    $('dDots').textContent = it.photos.length > 1 ? '左右滑動查看 ' + it.photos.length + ' 張照片' : '';
    var rows = [
      ['商品編號', it.code, true], ['分類', it.cat], ['條碼', it.barcode, true]
    ].concat(has.weight ? [['重量', it.weight != null ? kg(it.weight) : '']] : []).concat([
     
      ['現場價錢', yen(it.price)],
      ['現場特價', it.saleState === 'on' ? yen(it.sale)
        : it.saleState === 'ended' ? '已結束（原特價 ' + yen(it.saleRaw) + '）'
        : it.saleState === 'future' ? '尚未開始（' + yen(it.saleRaw) + '）' : '—'],
      ['特價期間', it.saleStart || it.saleEnd ? (it.saleStart || '').replace(/-/g,'/') + ' ～ ' + (it.saleEnd ? it.saleEnd.replace(/-/g,'/') : '不限') +
        (it.saleState === 'on' && it.saleEnd ? '（剩 ' + daysLeft(it.saleEnd) + ' 天）' : '') : ''],
      ['更新日期', it.date ? it.date.replace(/-/g,'/') : '']
    ]);
    if(it.sale!=null && it.price!=null && it.price > it.sale) rows.push(['折扣', '−' + yen(it.price - it.sale)]);
    $('dList').innerHTML = rows.map(function(r){
      var v = r[1] || '—';
      return '<div class="row"><span>'+r[0]+'</span><span'+(r[2] && r[1] ? ' class="copy" data-copy="'+esc(r[1])+'"' : '')+'>'+esc(v)+'</span></div>';
    }).join('');
    $('dTags').innerHTML = (it.tags || []).map(function(t){ return '<span class="dtag">'+esc(t)+'</span>'; }).join('');
    renderTabs(it);
    openSheet('detail');
    setUrl(it);
  }

  var TABS = [['info','商品資料'], ['desc','商品說明']];
  function renderTabs(it){
    var avail = TABS.filter(function(t){ return t[0] === 'info' || (it[t[0]] || '').trim(); });
    if(!avail.some(function(t){ return t[0] === curTab; })) curTab = 'info';
    $('dTabs').hidden = avail.length < 2;
    $('dTabs').innerHTML = avail.map(function(t){ return '<button data-tab="'+t[0]+'" class="'+(t[0]===curTab?'on':'')+'">'+t[1]+'</button>'; }).join('');
    $('dList').hidden = curTab !== 'info';
    $('dPane').hidden = curTab === 'info';
    if(curTab !== 'info') $('dPane').textContent = (it[curTab] || '').trim();
  }

  // ===== 表單 =====
  function openForm(it){
    editing = it || null;
    $('fTitle').textContent = it ? '編輯商品' : '新增商品';
    $('fName').value = it ? it.name : '';
    $('fCode').value = it ? it.code : '';
    fillCatSelect(it ? it.cat : (curCat !== '全部' && curCat !== '特價中' ? curCat : ''));
    $('fBarcode').value = it ? it.barcode : '';
    $('fPrice').value = it && it.price != null ? it.price : '';
    $('fSale').value = it && it.saleRaw != null ? it.saleRaw : '';
    $('fSaleStart').value = it ? (it.saleStart || '') : '';
    $('fSaleEnd').value = it ? (it.saleEnd || '') : '';
    $('fDate').value = today();
    $('fTagsBox').hidden = !has.tags; $('fDescBox').hidden = !has.desc;
    $('fWeightBox').hidden = !has.weight;
    $('fWeight').value = it && it.weight != null ? it.weight : '';
    $('fTags').value = it && it.tags ? it.tags.join(', ') : '';
    $('fDesc').value = it ? (it.desc || '') : '';
    renderTagPick();
    $('newCatBox').hidden = true;
    checkCodeLive();
    formPhotos = it ? it.photos.map(function(u){ return { kind:'old', url:u, preview:thumbUrl(u) }; }) : [];
    renderFormPhotos();
    closeSheets(); openSheet('form');
  }
  function fillCatSelect(val){
    var cats = allCats();
    if(val && cats.indexOf(val) < 0) cats.push(val);
    $('fCat').innerHTML = '<option value="">（未分類）</option>' +
      cats.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('') +
      '<option value="__new__">＋ 新增分類…</option>';
    $('fCat').value = val || '';
    $('fCat').setAttribute('data-prev', $('fCat').value);
  }
  // 公斤，四捨五入到小數點後 2 位
  function kg(w){
    var n = Math.round((Number(w) + Number.EPSILON) * 100) / 100;
    return n.toLocaleString('ja-JP', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' kg';
  }
  function splitTags(v){
    var out = [];
    String(v || '').split(/[,，、]/).forEach(function(t){ t = t.trim(); if(t && out.indexOf(t) < 0) out.push(t); });
    return out;
  }
  function renderTagPick(){
    var cur = splitTags($('fTags').value);
    var all = tagOptions.slice();
    items.forEach(function(i){ (i.tags || []).forEach(function(t){ if(all.indexOf(t) < 0) all.push(t); }); });
    $('fTagPick').innerHTML = all.map(function(t){ return '<button type="button" data-tag="'+esc(t)+'" class="'+(cur.indexOf(t)>=0?'on':'')+'">'+esc(t)+'</button>'; }).join('');
  }
  function daysLeft(end){
    var a = new Date(today() + 'T00:00:00'), b = new Date(end + 'T00:00:00');
    return Math.round((b - a) / 86400000) + 1;
  }
  function today(){
    var d = new Date(), p = function(n){ return (n<10?'0':'') + n; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }
  function renderFormPhotos(){
    $('fPhotos').innerHTML = formPhotos.map(function(p, idx){
      return '<div class="ph"><img src="'+esc(p.preview)+'" alt="">'+
        '<button class="x" data-del="'+idx+'">✕</button>'+
        (idx===0 ? '<span class="first">封面</span>' : '<button class="mv" data-first="'+idx+'">設為封面</button>')+'</div>';
    }).join('') + '<button class="addph" id="addPh"><b>＋</b>拍照／選圖</button>' +
      '<button class="addph" id="addUrl"><b>🔗</b>貼上網址</button>';
  }

  function compress(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, MAX_SIDE / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(h*s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', JPEG_Q));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('無法讀取照片：' + file.name)); };
      img.src = url;
    });
  }

  function addFiles(files){
    var arr = Array.prototype.slice.call(files);
    if(!arr.length) return;
    loading(true, '壓縮照片中…');
    var chain = Promise.resolve();
    arr.forEach(function(f, n){
      chain = chain.then(function(){ return compress(f); }).then(function(dataUrl){
        formPhotos.push({ kind:'pending', preview:dataUrl });
      });
    });
    chain.then(renderFormPhotos).catch(function(e){ toast(e.message); }).then(function(){ loading(false); $('fFile').value=''; });
  }

  function save(){
    var data = {
      name: $('fName').value.trim(), code: $('fCode').value.trim(), cat: $('fCat').value.trim(),
      barcode: $('fBarcode').value.trim(), price: $('fPrice').value.trim(), sale: $('fSale').value.trim(),
      saleStart: $('fSaleStart').value, saleEnd: $('fSaleEnd').value,
      date: $('fDate').value
    };
    if(!data.name){ toast('請輸入商品名稱'); $('fName').focus(); return; }
    if(has.tags) data.tags = splitTags($('fTags').value);
    if(has.desc) data.desc = $('fDesc').value.trim();
    if(has.weight) data.weight = $('fWeight').value.trim();
    if(data.saleEnd && !data.saleStart){ data.saleStart = today(); $('fSaleStart').value = data.saleStart; }
    if(data.saleStart && data.saleEnd && data.saleEnd < data.saleStart){ toast('特價結束日不能早於開始日'); $('fSaleEnd').focus(); return; }
    var localDup = localDupItem(data.code);
    if(localDup){ toast('商品編號「' + data.code + '」已經存在（' + (localDup.name || '未命名') + '）'); $('fCode').focus(); return; }
    var pending = formPhotos.filter(function(p){ return p.kind === 'pending'; });
    var done = 0;
    loading(true, '檢查商品編號…');
    // 上傳照片前先向 Notion 確認編號沒有重複，避免白白上傳
    var chain = (data.code ? api({ action:'checkCode', code:data.code, pageId: editing ? editing.id : '' }) : Promise.resolve({}))
      .then(function(r){
        if(r.duplicate) throw new Error('商品編號「' + data.code + '」已經存在（' + r.name + '），不能重複');
        $('loadTxt').textContent = pending.length ? '上傳照片 0/' + pending.length : '儲存中…';
      });
    pending.forEach(function(p){
      chain = chain.then(function(){
        return api({ action:'upload', contentType:'image/jpeg', data:p.preview.split(',')[1] });
      }).then(function(r){
        p.kind = 'old'; p.url = r.url; done++;
        $('loadTxt').textContent = '上傳照片 ' + done + '/' + pending.length;
      });
    });
    chain.then(function(){
      $('loadTxt').textContent = '寫入 Notion 中…';
      data.photos = formPhotos.map(function(p){ return p.url; });
      return api(editing ? { action:'update', pageId:editing.id, data:data } : { action:'create', data:data });
    }).then(function(r){
      if(editing){ items = items.map(function(i){ return i.id === r.item.id ? r.item : i; }); }
      else items.unshift(r.item);
      if(data.cat && categories.indexOf(data.cat) < 0) categories.push(data.cat);
      (data.tags || []).forEach(function(t){ if(tagOptions.indexOf(t) < 0) tagOptions.push(t); });
      writeCache(); render(); closeSheets();
      toast(editing ? '已更新' : '已新增');
    }).catch(function(e){
      toast('儲存失敗：' + e.message);
      if(/商品編號/.test(e.message)){ $('fCode').classList.add('bad'); $('fCode').focus(); }
    }).then(function(){ loading(false); });
  }

  function localDupItem(code){
    code = String(code || '').trim();
    if(!code) return null;
    return items.filter(function(i){ return i.code.trim() === code && (!editing || i.id !== editing.id); })[0] || null;
  }
  function checkCodeLive(){
    var d = localDupItem($('fCode').value);
    $('codeWarn').hidden = !d;
    $('codeWarn').textContent = d ? '⚠ 此編號已被「' + (d.name || '未命名') + '」使用' : '';
    $('fCode').classList.toggle('bad', !!d);
  }

  function del(){

  // ===== 匯出商品小卡 =====
  var CARD_FONT = '"PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif';
  var cardFile = null, cardUrl = '';

  function eanBits(code){
    var L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
    var G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
    var Rr = L.map(function(x){ return x.replace(/./g, function(c){ return c === '0' ? '1' : '0'; }); });
    var PAR = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
    var d = code.split('').map(Number), i, s;
    if(code.length === 13){
      s = '101';
      for(i = 1; i <= 6; i++) s += (PAR[d[0]][i-1] === 'L' ? L : G)[d[i]];
      s += '01010';
      for(i = 7; i <= 12; i++) s += Rr[d[i]];
      return s + '101';
    }
    if(code.length === 8){
      s = '101';
      for(i = 0; i < 4; i++) s += L[d[i]];
      s += '01010';
      for(i = 4; i < 8; i++) s += Rr[d[i]];
      return s + '101';
    }
    return null;
  }

  function wrapLines(ctx, text, maxW, maxLines){
    var lines = [], cur = '';
    Array.from(text).forEach(function(ch){
      if(ctx.measureText(cur + ch).width > maxW && cur){ lines.push(cur); cur = ch.trim() ? ch : ''; }
      else cur += ch;
    });
    if(cur) lines.push(cur);
    if(lines.length > maxLines){
      lines = lines.slice(0, maxLines);
      var last = lines[maxLines-1];
      while(last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      lines[maxLines-1] = last + '…';
    }
    return lines;
  }

  function rrect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
  }

  function loadImg(u){
    return new Promise(function(resolve){
      if(!u){ resolve(null); return; }
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ resolve(null); };
      img.src = cdn(u, 'c_limit,w_1200,q_auto,f_jpg');
    });
  }

  function drawCard(it, img){
    var W = 1080, PAD = 70, CW = W - PAD*2;
    var m = document.createElement('canvas').getContext('2d');
    m.font = '700 50px ' + CARD_FONT;
    var nameLines = wrapLines(m, it.name || '（未命名）', CW, 3);

    // 先算高度
    var y = PAD + CW + 50;           // 照片下方
    var metaY = y; y += 52 + 50;
    var nameY = y; y += nameLines.length * 66 + 16;
    var labelY = y; y += 44;
    var saleOn = it.sale != null;
    var priceY = y + 80; y = priceY + 40;
    var saleLineY = priceY + 76; if(saleOn) y += 72;
    var lineY = y; y += 40;
    var footY = y; y += 110;
    var H = y + 40 + 40;

    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#f3f0eb'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.shadowColor = 'rgba(60,55,50,.10)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 6;
    rrect(ctx, 40, 40, W-80, H-80, 40); ctx.fillStyle = '#fbfaf7'; ctx.fill(); ctx.restore();

    // 照片
    ctx.save(); rrect(ctx, PAD, PAD, CW, CW, 28); ctx.clip();
    ctx.fillStyle = '#ebe6de'; ctx.fillRect(PAD, PAD, CW, CW);
    if(img){
      var s = Math.max(CW / img.naturalWidth, CW / img.naturalHeight);
      var iw = img.naturalWidth * s, ih = img.naturalHeight * s;
      ctx.drawImage(img, PAD + (CW-iw)/2, PAD + (CW-ih)/2, iw, ih);
    } else {
      ctx.fillStyle = '#8b857d'; ctx.font = '36px ' + CARD_FONT; ctx.textAlign = 'center';
      ctx.fillText('沒有照片', W/2, PAD + CW/2); ctx.textAlign = 'left';
    }
    ctx.restore();

    // 特價標籤
    if(it.sale != null){
      ctx.font = '700 38px ' + CARD_FONT;
      var bw = ctx.measureText('特價').width + 48;
      rrect(ctx, PAD+24, PAD+24, bw, 64, 18); ctx.fillStyle = '#c49a94'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText('特價', PAD+48, PAD+57); ctx.textBaseline = 'alphabetic';
    }

    // 分類＋編號
    var x = PAD;
    ctx.textBaseline = 'middle';
    if(it.cat){
      ctx.font = '600 30px ' + CARD_FONT;
      var cw = ctx.measureText(it.cat).width + 40;
      rrect(ctx, x, metaY, cw, 52, 26); ctx.fillStyle = '#8a9a8b'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(it.cat, x + 20, metaY + 27);
      x += cw + 18;
    }
    var metaTxt = it.code ? '商品編號 #' + it.code : '';
    if(metaTxt){ ctx.font = '32px ' + CARD_FONT; ctx.fillStyle = '#8b857d'; ctx.fillText(metaTxt, x, metaY + 27); }
    ctx.textBaseline = 'alphabetic';

    // 名稱
    ctx.font = '700 50px ' + CARD_FONT; ctx.fillStyle = '#3d3a36';
    nameLines.forEach(function(l, i){ ctx.fillText(l, PAD, nameY + i*66 + 10); });

    // 價錢
    ctx.font = '30px ' + CARD_FONT; ctx.fillStyle = '#8b857d';
    ctx.fillText(saleOn ? '現場特價' : '現場價格', PAD, labelY + 10);

    // 重量（右側醒目方塊）
    var wBoxW = 0;
    if(it.weight != null){
      var wTxt = kg(it.weight);
      ctx.font = '800 60px ' + CARD_FONT;
      wBoxW = Math.max(200, ctx.measureText(wTxt).width + 56);
      var wx = W - PAD - wBoxW, wy = labelY - 22, wh = priceY - wy + 18;
      rrect(ctx, wx, wy, wBoxW, wh, 22); ctx.fillStyle = '#eef1ee'; ctx.fill();
      ctx.strokeStyle = '#d3dcd3'; ctx.lineWidth = 2; ctx.stroke();
      ctx.textAlign = 'center';
      ctx.font = '600 28px ' + CARD_FONT; ctx.fillStyle = '#6f7f70'; ctx.fillText('重量', wx + wBoxW/2, wy + 46);
      ctx.font = '800 60px ' + CARD_FONT; ctx.fillStyle = '#3d3a36'; ctx.fillText(wTxt, wx + wBoxW/2, wy + wh - 34);
      ctx.textAlign = 'left';
    }
    var priceMaxX = W - PAD - (wBoxW ? wBoxW + 24 : 0);
    if(it.sale != null || it.price != null){
      var main = yen(it.sale != null ? it.sale : it.price);
      ctx.font = '800 96px ' + CARD_FONT; ctx.fillStyle = it.sale != null ? '#a8807a' : '#3d3a36';
      ctx.fillText(main, PAD, priceY);
      var mw = ctx.measureText(main).width;
      if(it.sale != null && it.price != null){
        var old = yen(it.price);
        ctx.font = '44px ' + CARD_FONT; ctx.fillStyle = '#8b857d';
        var ox = PAD + mw + 26, ow = ctx.measureText(old).width;
        if(ox + ow <= priceMaxX){
          ctx.fillText(old, ox, priceY - 4);
          ctx.fillRect(ox - 2, priceY - 20, ow + 4, 3);
        }
      }
      // 特價期間＋省多少
      if(saleOn){
        var parts = [];
        if(it.saleStart || it.saleEnd) parts.push('特價期間 ' + (it.saleStart || '').replace(/-/g,'/') + ' ～ ' + (it.saleEnd ? it.saleEnd.replace(/-/g,'/') : '不限'));
        if(it.price != null && it.price > it.sale) parts.push('省 ' + yen(it.price - it.sale));
        if(parts.length){
          ctx.font = '600 32px ' + CARD_FONT;
          var tw = ctx.measureText(parts.join('　')).width + 40;
          rrect(ctx, PAD, saleLineY - 38, Math.min(tw, CW), 54, 14); ctx.fillStyle = '#f5ebe9'; ctx.fill();
          ctx.fillStyle = '#a8807a'; ctx.fillText(parts.join('　'), PAD + 20, saleLineY);
        }
      }
    } else {
      ctx.font = '600 56px ' + CARD_FONT; ctx.fillStyle = '#8b857d'; ctx.fillText('—', PAD, priceY);
    }

    // 分隔線
    ctx.strokeStyle = '#e2ddd5'; ctx.lineWidth = 2; ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(PAD, lineY); ctx.lineTo(W-PAD, lineY); ctx.stroke(); ctx.setLineDash([]);

    // 底部：日期＋條碼
    ctx.font = '28px ' + CARD_FONT; ctx.fillStyle = '#8b857d';
    ctx.fillText('日本好市多 現場商品', PAD, footY + 40);
    if(it.date) ctx.fillText('更新日期 ' + it.date.replace(/-/g, '/'), PAD, footY + 84);
    var bc = String(it.barcode || '').replace(/\D/g, ''), bits = bc && eanBits(bc);
    if(bits){
      var mod = bits.length === 95 ? 3 : 4, bw2 = bits.length * mod, bx = W - PAD - bw2;
      ctx.fillStyle = '#3d3a36';
      for(var i = 0; i < bits.length; i++) if(bits[i] === '1') ctx.fillRect(bx + i*mod, footY + 6, mod, 60);
      ctx.font = '22px ' + CARD_FONT; ctx.textAlign = 'center';
      ctx.fillText(bc.split('').join(' '), bx + bw2/2, footY + 94); ctx.textAlign = 'left';
    } else if(it.barcode){
      ctx.font = '30px ' + CARD_FONT; ctx.textAlign = 'right'; ctx.fillStyle = '#3d3a36';
      ctx.fillText('條碼 ' + it.barcode, W - PAD, footY + 40); ctx.textAlign = 'left';
    }
    return c;
  }

  function canvasBlob(c){
    return new Promise(function(resolve, reject){
      try{ c.toBlob(function(b){ b ? resolve(b) : reject(new Error('產生圖片失敗')); }, 'image/png'); }
      catch(e){ reject(e); }
    });
  }

  function exportCard(){

  // ===== 一鍵下載全部照片（管理者） =====
  var dlReady = null; // { id, files }
  function safeName(t){ return String(t || '').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 50); }
  function extOf(type, url){
    if(/png/.test(type)) return 'png';
    if(/webp/.test(type)) return 'webp';
    if(/heic|heif/.test(type)) return 'heic';
    var m = /\.(jpe?g|png|webp|gif|heic)(\?|$)/i.exec(url || '');
    return m ? m[1].toLowerCase().replace('jpeg', 'jpg') : 'jpg';
  }
  function fetchPhotos(it){
    var base = (it.code ? it.code + '_' : '') + safeName(it.name || 'item');
    var files = [], fail = 0, done = 0;
    var chain = Promise.resolve();
    it.photos.forEach(function(u, n){
      chain = chain.then(function(){
        return fetch(u, { mode:'cors' }).then(function(r){
          if(!r.ok) throw new Error(r.status);
          return r.blob();
        }).then(function(b){
          var type = b.type || 'image/jpeg';
          files.push(new File([b], base + '_' + (n + 1) + '.' + extOf(type, u), { type:type }));
        }).catch(function(){ fail++; })
          .then(function(){ done++; $('loadTxt').textContent = '下載照片 ' + done + '/' + it.photos.length; });
      });
    });
    return chain.then(function(){ return { files:files, fail:fail, base:base }; });
  }
  function loadJSZip(){
    if(window.JSZip) return Promise.resolve(window.JSZip);
    return new Promise(function(resolve, reject){
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      sc.onload = function(){ resolve(window.JSZip); };
      sc.onerror = function(){ reject(new Error('無法載入壓縮工具')); };
      document.head.appendChild(sc);
    });
  }
  function saveBlob(blob, name){
    var u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
  }
  function canShareFiles(files){
    try{ return !!(navigator.canShare && navigator.share && navigator.canShare({ files:files })); }catch(e){ return false; }
  }
  var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function shareFiles(files){
    return navigator.share({ files:files }).then(function(){ dlReady = null; resetDlBtn(); }, function(e){
      if(e && e.name === 'AbortError') return; // 使用者取消
      // iPhone 下載時間太久會失去「按鈕觸發」資格 → 請使用者再按一次
      $('dDlAll').textContent = '📥 已準備好，點這裡存到相簿（' + files.length + ' 張）';
      toast('照片已準備好，請再按一次按鈕');
    });
  }
  function resetDlBtn(){
    if(curItem) $('dDlAll').textContent = '⬇ 下載全部照片（' + curItem.photos.length + ' 張）';
  }
  function downloadAll(){
    var it = curItem;
    if(!it || !it.photos.length) return;
    if(dlReady && dlReady.id === it.id && canShareFiles(dlReady.files)){ shareFiles(dlReady.files); return; }
    loading(true, '下載照片 0/' + it.photos.length);
    fetchPhotos(it).then(function(r){
      if(!r.files.length) throw new Error('照片都無法下載');
      if(isMobile && canShareFiles(r.files)){
        dlReady = { id:it.id, files:r.files };
        loading(false);
        return shareFiles(r.files);
      }
      if(r.fail) toast(r.fail + ' 張照片無法下載，已略過');
      if(r.files.length === 1){ saveBlob(r.files[0], r.files[0].name); return; }
      $('loadTxt').textContent = '壓縮中…';
      return loadJSZip().then(function(JSZip){
        var zip = new JSZip();
        r.files.forEach(function(f){ zip.file(f.name, f); });
        return zip.generateAsync({ type:'blob' });
      }).then(function(blob){ saveBlob(blob, r.base + '_' + r.files.length + '張.zip'); toast('已下載 ' + r.files.length + ' 張照片' + (r.fail ? '（' + r.fail + ' 張失敗已略過）' : '')); });
    }).catch(function(e){ toast('下載失敗：' + e.message); })
      .then(function(){ loading(false); });
  }

    $('pwInput').value = '';
    closeSheets(); openSheet('settings');
    if(!on) setTimeout(function(){ $('pwInput').focus(); }, 300);
  }
  function unlock(){
    var pw = $('pwInput').value.replace(/\D/g, '');
    if(!pw){ toast('請輸入密碼'); return; }
    loading(true, '驗證中…');
    fetch('/api/notion', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'auth', adminKey: pw }) })
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || '驗證失敗'); }); })
      .then(function(){ setKey(pw); setShow(true); applyAdmin(); openSettings(); toast('已解鎖'); })
      .catch(function(e){ toast(e.message); $('pwInput').select(); })
      .then(function(){ loading(false); });
  }
  $('setBtn').addEventListener('click', openSettings);
  $('pwBtn').addEventListener('click', unlock);
  $('pwEye').addEventListener('click', function(){
    var m = $('pwInput').classList.toggle('pw-mask');
    this.textContent = m ? '顯示' : '隱藏';
    $('pwInput').focus();
  });
  $('pwInput').addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); unlock(); } });
  $('adminToggle').addEventListener('change', function(){ setShow(this.checked); applyAdmin(); toast(this.checked ? '已顯示管理功能' : '已隱藏管理功能'); });
  $('logoutBtn').addEventListener('click', function(){ setKey(''); applyAdmin(); closeSheets(); toast('已鎖定'); });

  applyAdmin();
  load(false);
})();
</script>
</body>
</html>
